<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#002d62">
  <link rel="manifest" href="/pb-control.webmanifest">
  <link rel="apple-touch-icon" href="/icons/pb/apple-touch-icon.png">
  <title>Instalar PB Control</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;color:#162033;font-family:Inter,system-ui,-apple-system,sans-serif;padding:24px}.card{width:min(100%,460px);background:#fff;border:1px solid #e5e8ee;border-radius:22px;padding:28px;box-shadow:0 16px 50px #001a3e18;text-align:center}.icon{width:88px;height:88px;border-radius:22px;margin:0 auto 18px;display:block}h1{color:#002d62;margin:0 0 8px;font-size:1.65rem}p{color:#667085;line-height:1.55;margin:0 0 20px}.button{width:100%;border:0;border-radius:12px;background:#ce1126;color:#fff;padding:14px 18px;font:900 1rem system-ui;cursor:pointer}.button.secondary{display:block;background:#fff;color:#002d62;border:1px solid #cbd2dc;text-decoration:none;margin-top:10px}.help{font-size:.82rem;margin-top:18px}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icons/pb/icon-192.png" alt="Planeta Boricua">
    <h1>PB Control</h1>
    <p>Instala el Centro de Control de Planeta Boricua en la pantalla de tu celular. Al abrirlo entrarás directamente al dashboard.</p>
    <button id="install" class="button hidden" type="button">Instalar PB Control</button>
    <a class="button secondary" href="/pb-control">Abrir Centro de Control</a>
    <p id="help" class="help">Si no aparece el botón de instalar, abre el menú ⋮ de Chrome y toca <strong>Instalar aplicación</strong> o <strong>Añadir a pantalla principal</strong>.</p>
  </main>
  <script>
    let installPrompt;
    const button=document.getElementById('install');
    const help=document.getElementById('help');
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;button.classList.remove('hidden');help.textContent='Toca Instalar PB Control y confirma. El icono aparecerá en tu pantalla principal.';});
    button.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;button.classList.add('hidden');});
    window.addEventListener('appinstalled',()=>{help.textContent='PB Control quedó instalado. Ya puedes abrirlo desde tu pantalla principal.';});
  </script>
</body>
</html>
