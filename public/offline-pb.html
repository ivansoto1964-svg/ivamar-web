<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0033A0">
  <title>Planeta Boricua — Sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#002D62,#001a3d);font-family:system-ui,sans-serif;color:#fff;text-align:center;padding:2rem}.card{max-width:420px}.icon{width:96px;height:96px;border-radius:22px;margin-bottom:1rem}h1{font-family:Georgia,serif;margin:.4rem 0}p{color:rgba(255,255,255,.75);line-height:1.6}button{background:#CE1126;color:#fff;border:0;border-radius:8px;padding:.8rem 1.2rem;font-weight:700;font-size:1rem;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/icons/pb/icon-192.png" alt="Planeta Boricua">
    <h1>El coquí está descansando 🌙</h1>
    <p>Ahora mismo no tienes conexión. Intenta nuevamente cuando regreses a internet.</p>
    <button onclick="location.reload()">Volver a intentar</button>
  </main>
</body>
</html>
