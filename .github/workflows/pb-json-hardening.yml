name: Harden PB JSON parsing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb-json-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove duplicate parsers and handle malformed JSON cleanly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/server.js')
          s = p.read_text()

          primary = """app.use(express.json({ limit: '15mb' }));\napp.use(express.urlencoded({ limit: '15mb', extended: true }));\n"""
          if primary not in s:
              raise SystemExit('Primary JSON parser block not found')

          handler = """app.use((err, req, res, next) => {\n  if (err && err.type === 'entity.parse.failed' && err instanceof SyntaxError) {\n    const requestPath = req.originalUrl || req.url || 'unknown';\n    console.warn(`[bad-json] ${req.method} ${requestPath}: malformed JSON rejected`);\n    return res.status(400).json({ ok:false, error:'Invalid JSON body.' });\n  }\n  if (err && err.type === 'entity.too.large') {\n    const requestPath = req.originalUrl || req.url || 'unknown';\n    console.warn(`[body-too-large] ${req.method} ${requestPath}: request rejected`);\n    return res.status(413).json({ ok:false, error:'Request body too large.' });\n  }\n  next(err);\n});\n"""

          if handler not in s:
              s = s.replace(primary, primary + handler, 1)

          duplicate = """app.use(express.json());\napp.use(express.urlencoded({ extended: true }));\n"""
          if duplicate in s:
              s = s.replace(duplicate, '', 1)

          p.write_text(s)
          PY
      - name: Basic syntax check
        run: node --check src/server.js
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "JSON parsing already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Harden malformed JSON handling and remove duplicate parsers"
          git push origin main
