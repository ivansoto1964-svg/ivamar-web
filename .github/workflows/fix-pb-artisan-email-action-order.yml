name: Fix PB artisan email action routing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix action routing order
        run: python3 scripts/fix-pb-artisan-email-action-order.py
      - name: Validate server syntax
        run: node --check src/server.js
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "PB artisan email routing already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Fix PB artisan email action routing"
          git push origin main
