name: Install PB search and edit fixes

on:
  push:
    paths:
      - 'scripts/install-pb-search-and-edit-fixes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fixes
        run: python3 scripts/install-pb-search-and-edit-fixes.py
      - name: Validate syntax
        run: |
          node --check src/views/planetaboricua/feriaartesanos.js
          node --check src/views/planetaboricua/artesano-admin.js
          node --check src/views/planetaboricua/artesano-perfil.js
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "Fixes already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/planetaboricua/feriaartesanos.js src/views/planetaboricua/artesano-admin.js src/views/planetaboricua/artesano-perfil.js
          git commit -m "Improve artisan search and edit feedback"
          git push origin main
