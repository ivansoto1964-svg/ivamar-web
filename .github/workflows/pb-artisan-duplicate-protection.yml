name: Install PB artisan duplicate protection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply duplicate protection
        run: python3 scripts/install-pb-artisan-duplicate-protection.py
      - name: Validate server syntax
        run: node --check src/server.js
      - name: Commit protection
        run: |
          if git diff --quiet; then
            echo "Duplicate protection already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Protect PB artisan registration from duplicates"
          git push origin main
