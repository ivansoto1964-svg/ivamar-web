name: Install PB artisan admin editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pb-artisan-admin.yml'
      - 'scripts/install-pb-artisan-admin.py'
      - 'src/views/planetaboricua/artesano-admin.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply PB artisan admin editor
        run: python3 scripts/install-pb-artisan-admin.py
      - name: Validate syntax
        run: |
          node --check src/server.js
          node --check src/views/planetaboricua/artesano-admin.js
      - name: Verify routes
        run: |
          grep -q "app.get('/pb-control/artesanos'" src/server.js
          grep -q "app.post('/pb-control/artesanos/:id'" src/server.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Add PB Control artisan editor"
          git push origin main
