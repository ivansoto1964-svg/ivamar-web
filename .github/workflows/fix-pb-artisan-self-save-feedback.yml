name: Fix PB artisan self-service save feedback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-pb-artisan-self-save-feedback.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fix
        run: python scripts/fix-pb-artisan-self-save-feedback.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views/planetaboricua/artesano-mi-perfil.js
          git commit -m 'Keep artisan save confirmation next to button'
          git push
